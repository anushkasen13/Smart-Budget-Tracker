services:
  - type: web
    name: smartbudget-auth-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: smartbudget-auth-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
databases:
  - name: smartbudget-auth-db
    databaseName: smartbudget_auth
    user: smartbudget_auth
